[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Platform for tracking and simulating currency trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"

rates_ttl_seconds = 300
default_base_currency = "USD"

log_file = "logs/actions.log"
log_format = "text"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3
